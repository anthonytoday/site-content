# New Worker for the Notion Workspace Security Check. workers.dev only: no zone route, no DNS.
name = "security-check-api"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true

[[rules]]
type = "Text"
globs = ["**/*.html", "**/*.txt"]
fallthrough = true

[[kv_namespaces]]
binding = "SC"
id = "8ed13b551cba434f92867aee1e122d36"

[vars]
# DRY_RUN "0" + LIVE_FOR "allowlist": real Notion writes and Resend sends ONLY for TEST_SEND_ALLOWLIST; every other
# address runs the dry-run pipeline (real-client lock). Set LIVE_FOR = "all" only after L0_CEO approves.
DRY_RUN = "0"
LIVE_FOR = "all"
PUBLIC_BASE = "https://security-check-api.learningamazonfba.workers.dev"
# Maturity staircase PNG host. PREVIEW: the Pages preview (serves /assets from this branch). PRODUCTION: "https://www.anthonytoday.com" once PR #21 is merged.
MATURITY_IMG_BASE = "https://www.anthonytoday.com"
ALLOWED_ORIGINS = "https://www.anthonytoday.com,https://anthonytoday.com"
MAIL_FROM = "Anthony from AnthonyToday.com <admin@anthonytoday.com>"
FIXLIST_PAYMENT_LINK = "https://buy.stripe.com/28E6oJfmMbYh27h4Kt1ZS0x"
FIXLIST_PAYMENT_LINK_ID = "plink_1US9EnQ1Ll6EnCUKqtFqIhCG"
UNSUB_MINT_URL = "https://jzmglkzmqgojjnqxoytf.supabase.co/functions/v1/cc-hooks/mint"
# secret UNSUB_MINT_TOKEN (shared unsubscribe mint, Bearer). Set at deploy, never echo it:
#   tr -d '\n' < /workspace/resilient-email/.mint_token | wrangler secret put UNSUB_MINT_TOKEN
# UNSUB_SHARED_SYNC = "0"  # default on: a Worker (u1/legacy) unsubscribe is also sent to the shared unsub function (which sets crm_contacts.dne)
# MULTI_MATCH_POLICY = "alert_only"  # default latest_and_alert: several results for the checkout email -> deliver the latest + alert admin@
NOTION_FREE_RESULT_TEMPLATE_ID = "3fef028b-623e-8111-9386-c5d5bb6e3b08"
NOTION_FIXLIST_TEMPLATE_ID = "3fef028b-623e-811b-934c-febfe7589542"
NOTION_FIXLIST_ACTION_DB_ID = "66ef028b623e826d889a8177a187e730"
NOTION_FIXLIST_ACTION_DS_ID = "090f028b-623e-830a-a790-87771191a643"
# Where client pages are created. Must be inside the one-pager (the integration only sees that tree).
NOTION_RESULTS_PARENT_ID = "3fef028b623e8111a139e906174cab62"
TEST_SEND_ALLOWLIST = "admin@anthonytoday.com"
RATE_PER_IP_HOUR = "20"
# P1-06 one-off email index migration (temporary: 0034b removes this var and the cron below)
MIGRATE_EH = "run-2026-10-20"

[triggers]
crons = ["*/5 * * * *"]

# Secrets (wrangler secret put): SIGNING_KEY, TEST_TOKEN (set), NOTION_TOKEN, NOTION_CRM_DB_ID, RESEND_API_KEY,
# STRIPE_WEBHOOK_SECRET, SUPABASE_URL + SUPABASE_SERVICE_KEY (set, not used yet), optional CC_INGEST_URL + CC_INGEST_TOKEN (Command Center / Supabase insert endpoint).

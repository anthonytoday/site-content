# On-site shop (/shop/), 23 Oct 2026. One entry per live Gumroad product on store.anthonytoday.com.
# Names, prices and links were read from the public store and product pages on 23 Oct 2026 (UAE)
# and every product URL returned 200. Prices are what Gumroad shows a USD buyer; products priced
# in CHF are converted by Gumroad at checkout, so the cents can drift with the exchange rate.
# overlay: true  -> standard Gumroad page, opens in the gumroad.js overlay on /shop/.
# overlay: false -> custom-HTML Gumroad page; Gumroad sends it with X-Frame-Options SAMEORIGIN, so it
#                   cannot open in the overlay and opens on store.anthonytoday.com in a new tab instead.
# Covers are the Gumroad square thumbnails, saved in assets/shop/ (never hotlinked).
# Em dashes in Gumroad names are rewritten because house style forbids them.

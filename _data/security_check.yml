# Maturity staircase (result screen, /r/, /f/, emails, Notion pages). Single config spot:
# edit here, then run tools/security-check/maturity/build.sh to re-render the 4 PNGs.
maturity:
  title: Your Security Maturity Level
  footnote: Your overall level is your lowest area.
  image_path: /assets/img/security-check/maturity-level-
  # Definitions: PM copy file "Maturity Levels (CMMI Style, Rev 10:55 am UAE)", keys level.1..level.5. Bands: L0_CEO 10:59 am UAE.
  # Edit here, then run tools/security-check/maturity/build.sh to re-render the 5 PNGs.
  levels:
    - number: 1
      name: Initial
      range: 0 to 19
      meaning: Ad hoc setup, little control over access or sharing.
      color: "#C8102E"
      muted: "#F3C7CE"
    - number: 2
      name: Managed
      range: 20 to 39
      meaning: Some safeguards exist, but they depend on individual people.
      color: "#E0620F"
      muted: "#F8D3B9"
    - number: 3
      name: Defined
      range: 40 to 59
      meaning: Clear workspace rules exist, and most people follow them.
      color: "#E5A00D"
      muted: "#F8E3B4"
    - number: 4
      name: Quantitatively Managed
      range: 60 to 89
      meaning: Access and sharing are reviewed on a schedule and tracked.
      color: "#6FA83A"
      muted: "#D6E8C4"
    - number: 5
      name: Optimizing
      range: 90 to 100
      meaning: Controls are tested and improved as the team changes.
      color: "#16793A"
      muted: "#BFDCC8"

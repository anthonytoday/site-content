questions:
- id: q1
  number: 1
  title: Sign-In Strength
  control: strong authentication
  question: Think of everyone who can log in to your Notion. How do they sign in?
  answers:
    A:
      text: Everyone has 2-step verification turned on, in Notion or in the company Google or Microsoft login they use for Notion.
      points: 10
    B:
      text: I have 2-step verification on, but I'm not sure about everyone else.
      points: 6
    C:
      text: Most of us sign in with a password or an email code only.
      points: 2
    D:
      text: I don't know.
      points: 0
  risk: one phished password opens every page that person can see. Notion can't force 2-step verification on members on any plan, so it comes down to each person.
  fixes:
  - text: 'Each person: Settings → your name → Account security → 2-step verification → Add verification method. Use an authenticator app and save the backup codes.'
    source: https://www.notion.com/help/two-step-verification
  - text: Make it a written team rule and check it person by person once a quarter.
  - text: If the team signs in with Google or Microsoft, turn on 2-step verification in that account too (general guidance, outside Notion).
  plan_notes:
  - text: 'All plans: 2-step verification. It needs a password on the account.'
    source: https://www.notion.com/pricing
    plans:
    - all
  - text: 'Business and Enterprise: SAML SSO. Settings → Identity → verify domain → Enable SAML SSO → Login method "Only SAML SSO". Remove all Allowed email domains first.'
    source: https://www.notion.com/help/saml-sso-configuration
    plans:
    - business
    - enterprise
    - not_sure
  - text: 'Enterprise only: organization owners can require MFA for guests. Free, Plus and Business alternative: ask guests to turn on 2-step verification before you share client pages.'
    source: https://www.notion.com/help/two-step-verification
    plans:
    - all
  domain: identity
- id: q2
  number: 2
  title: One Person, One Account, Right Access Type
  control: unique identities and correct roles
  question: Does everyone who opens your workspace use their own account, with the right type of access (staff as members, clients and freelancers as guests on specific pages)?
  answers:
    A:
      text: Yes. Everyone has their own account, staff are members, and outsiders are guests on only the pages they need.
      points: 10
    B:
      text: Own accounts, but some freelancers or clients are full members.
      points: 6
    C:
      text: Some people share one login.
      points: 2
    D:
      text: I don't know.
      points: 0
  risk: a shared login means no one is accountable and you can't remove one person without locking out others. An outsider added as a member can open every open teamspace.
  fixes:
  - text: Give every person their own account. Retire shared logins.
  - text: Settings → People (or Members) → Members tab. Remove outsiders, then re-invite them as guests on specific pages (Share → invite → Skip for now).
    source: https://www.notion.com/help/add-members-admins-guests-and-groups
  - text: 'Settings → General → Allowed email domains: list only your company domain. Anyone with a listed domain can join as a member.'
    source: https://www.notion.com/help/workspace-settings
  plan_notes:
  - text: 'Guest limit: Free 10; Plus, Business and Enterprise unlimited.'
    source: https://www.notion.com/pricing
    plans:
    - all
  - text: Restricted members (for people who need a whole teamspace but not the rest of the workspace) are described in the help center without a plan.
    source: https://www.notion.com/help/whos-who-in-a-workspace
    verify: plan availability
    plans:
    - all
  domain: identity
- id: q3
  number: 3
  title: Public Pages and Links
  control: data exposure to the internet
  question: Are any of your Notion pages open to the public, as a published site or with "Anyone on the web with link"?
  answers:
    A:
      text: Only pages we meant to make public, and we checked the full list in the last 3 months.
      points: 10
    B:
      text: Only pages we meant to make public, but we haven't checked in a while.
      points: 6
    C:
      text: Probably some old ones nobody has checked.
      points: 2
    D:
      text: I don't know.
      points: 0
  risk: anyone with the link (or a search engine, if indexing is on) can read the page and all its subpages, and the page data includes contributors' names and emails.
  fixes:
  - text: 'Share → Publish → All published sites: review the list and Unpublish anything that shouldn''t be live. Subpages are published too.'
    source: https://www.notion.com/help/public-pages-and-web-publishing
  - text: 'Share → General access: if a page says "Anyone on the web with link" and shouldn''t, select Remove. Unpublishing a site doesn''t turn this off.'
    source: https://www.notion.com/help/public-pages-and-web-publishing
  - text: 'For links that must stay open (for example a client proposal): set Link expires in the same dropdown.'
    source: https://www.notion.com/help/sharing-and-permissions
  plan_notes:
  - text: 'Enterprise only: Settings → Security → Disable publishing sites, forms, and public links. Free, Plus and Business alternative: the quarterly review above, owned by one named person.'
    source: https://www.notion.com/help/public-pages-and-web-publishing
    plans:
    - all
  domain: sharing
- id: q4
  number: 4
  title: Sensitive Data in Pages
  control: data classification and secrets handling
  question: Do any pages hold passwords, API keys, bank or card details, ID scans, or client personal data?
  answers:
    A:
      text: No. Passwords and keys live in a password manager, and client personal data sits only on restricted pages.
      points: 10
    B:
      text: A few logins or client details, on pages only the right people can open.
      points: 6
    C:
      text: Yes, on pages the whole team, guests or connected tools can open.
      points: 2
    D:
      text: I don't know.
      points: 0
  risk: 'everyone with access, every connected tool and every public link can read them. Deleting the text later is not enough: old versions stay in version history, and deleted pages stay in Trash for 30 days by default.'
  fixes:
  - text: Search the workspace for "password", "login", "IBAN", "API key" and "passport". List every page that comes up.
  - text: Move secrets to a password manager, delete them from the page, then change every password or key that was ever stored in Notion.
    source: https://www.notion.com/help/duplicate-delete-and-restore-content
  - text: 'Restrict pages that must keep personal data: Share → remove everyone who doesn''t need it.'
    source: https://www.notion.com/help/sharing-and-permissions
  plan_notes:
  - text: 'Enterprise only: Security and Compliance connections (DLP) can detect sensitive content. Free, Plus and Business alternative: the search above, repeated each quarter.'
    source: https://www.notion.com/pricing
    plans:
    - all
  domain: sharing
- id: q5
  number: 5
  title: Connected Apps
  control: third-party access management
  question: Think of the apps connected to your Notion (Zapier, Make, Slack, form or calendar tools). Which is closest?
  answers:
    A:
      text: We know every connection, each one has an owner, and we removed unused ones in the last 3 months.
      points: 10
    B:
      text: A few connections, probably all still used, never reviewed.
      points: 6
    C:
      text: Many, added by different people over time.
      points: 2
    D:
      text: I don't know.
      points: 0
  risk: each connection is a vendor holding a key to the pages it was given. Forgotten connections and copied tokens keep working after the project, and after the person who set them up leaves.
  fixes:
  - text: 'Settings → Connections → Manage: review each one, and select ••• → Disconnect for anything unused or unknown.'
    source: https://www.notion.com/help/add-and-manage-connections-with-the-api
  - text: 'On sensitive pages: ••• → More → Connections. Disconnect what doesn''t need that page.'
    source: https://www.notion.com/help/add-and-manage-connections-with-the-api
  - text: 'If an internal connection token was ever shared: Settings → Connections → Develop or manage connections → find the connection → Refresh, then update every tool that used it.'
    source: https://developers.notion.com/guides/get-started/handling-api-keys
  plan_notes:
  - text: 'Enterprise only: restrict which connections members can install and keep an approved list. Free, Plus and Business alternative: a one-page list of approved connections with an owner each, checked quarterly.'
    source: https://www.notion.com/help/add-and-manage-connections-with-the-api
    plans:
    - all
  domain: integrations
- id: q6
  number: 6
  title: AI Tools
  control: AI and automation access
  question: Have AI tools been connected to your Notion (for example ChatGPT, Claude or AI agents)?
  answers:
    A:
      text: None, or only tools we approved, limited to the pages they need.
      points: 10
    B:
      text: Yes, I connected one, and it can reach most of the workspace.
      points: 6
    C:
      text: Yes, people connect their own AI tools and nobody tracks it.
      points: 2
    D:
      text: I don't know.
      points: 0
  risk: an AI tool reads everything it can reach. Broad access puts client and finance pages in scope, and text inside a page can try to steer an AI tool that reads it (prompt injection).
  fixes:
  - text: 'Settings → Connections: find each AI tool, check who installed it, and disconnect what isn''t approved.'
    source: https://www.notion.com/help/add-and-manage-connections-with-the-api
  - text: Give AI tools access to specific pages, never the whole workspace, and keep finance, HR and client pages out of scope.
  - text: 'Write a short team rule: which AI tools are approved, and who approves new ones.'
  plan_notes:
  - text: 'Enterprise only: approved connections list, and the audit log records when external AI tools connect or read pages. Free, Plus and Business alternative: the team rule and quarterly review above.'
    source: https://www.notion.com/help/audit-log
    plans:
    - all
  domain: integrations
- id: q7
  number: 7
  title: Leavers
  control: timely deprovisioning
  question: When someone leaves (staff or contractor), what happens to their Notion access?
  answers:
    A:
      text: Removed on their last day with a checklist, and their pages are handed over first.
      points: 10
    B:
      text: Removed, but not always right away.
      points: 6
    C:
      text: Usually forgotten until someone notices.
      points: 2
    D:
      text: I don't know.
      points: 0
  risk: ex-staff and ex-contractors can still open, copy or delete company pages, and the tools they connected keep running.
  fixes:
  - text: 'Before removal: move their work pages out of their Private section into a teamspace. A removed member''s private pages are hidden.'
    source: https://www.notion.com/help/whos-who-in-a-workspace
  - text: Settings → People (or Members) → Members or Guests tab → Remove from workspace. Access ends instantly.
    source: https://www.notion.com/help/whos-who-in-a-workspace
  - text: Disconnect connections they set up, and change shared passwords they knew.
    source: https://www.notion.com/help/add-and-manage-connections-with-the-api
  - text: Keep a one-page leaver checklist in your ops teamspace and run it on the last day.
  plan_notes:
  - text: 'Enterprise only: user provisioning (SCIM) removes people automatically when they leave your identity provider. Free, Plus and Business alternative: the leaver checklist.'
    source: https://www.notion.com/pricing
    plans:
    - all
  domain: people
  solo_na: 'Not applicable: only I have ever had access'
- id: q8
  number: 8
  title: Access Review
  control: periodic access review
  question: When did someone last go through the full list of members and guests and remove who no longer needs access?
  answers:
    A:
      text: In the last 3 months, and it's on a schedule.
      points: 10
    B:
      text: In the last year.
      points: 6
    C:
      text: Never.
      points: 2
    D:
      text: I don't know.
      points: 0
  risk: access only ever grows. Old clients, past freelancers and people who changed roles keep access no one remembers giving.
  fixes:
  - text: 'Settings → People (or Members): go through the Members and Guests tabs and remove anyone who no longer needs access.'
    source: https://www.notion.com/help/whos-who-in-a-workspace
  - text: Put a quarterly 20-minute access review on the owner's calendar.
  - text: Use permission groups by role (for example "Sales", "Ops") so access follows the role, not the person.
    source: https://www.notion.com/pricing
  plan_notes:
  - text: 'All plans: permission groups.'
    source: https://www.notion.com/pricing
    plans:
    - all
  - text: 'Business and Enterprise: Settings → General → Export members as CSV, to review the list offline.'
    source: https://www.notion.com/help/workspace-settings
    plans:
    - business
    - enterprise
    - not_sure
  domain: people
  solo_na: 'Not applicable: only I have ever had access'
- id: q9
  number: 9
  title: Admin Rights
  control: privileged access
  question: How many people are Workspace owners (full admin rights) in your Notion?
  answers:
    A:
      text: Exactly 2, chosen on purpose.
      points: 10
    B:
      text: Only 1 (usually me).
      points: 6
    C:
      text: 3 or more, or I'm not sure who.
      points: 2
    D:
      text: I don't know.
      points: 0
  risk: every workspace owner can change all security settings, remove people, export everything or delete the workspace. Too many owners means too many master keys; one owner means a lockout if that account is lost.
  fixes:
  - text: 'Settings → People (or Members) → Members tab: change anyone who doesn''t need full admin rights from Workspace owner to Member. Keep 2 named owners.'
    source: https://www.notion.com/help/whos-who-in-a-workspace
  - text: Both owners turn on 2-step verification (Q1).
  plan_notes:
  - text: 'Enterprise only: membership admins and granular admin roles, for people who manage members without full admin rights. Free, Plus and Business alternative: keep 2 owners and let them handle member changes.'
    source: https://www.notion.com/pricing
    plans:
    - all
  domain: governance
- id: q10
  number: 10
  title: Default Access
  control: least privilege by default
  question: When someone new joins your workspace, what can they open on day one?
  answers:
    A:
      text: Only the areas for their role. Finance, HR and client areas are closed off.
      points: 10
    B:
      text: Everything, but sensitive pages are view-only or locked.
      points: 6
    C:
      text: Everything, and they can edit or share it.
      points: 2
    D:
      text: I don't know.
      points: 0
  risk: every new hire, freelancer turned member or compromised account can read, change or reshare finance, HR and client pages on day one.
  fixes:
  - text: 'Sidebar → hover a teamspace → ••• → Teamspace settings → Permissions: set sensitive teamspaces to Closed and give everyone else the lowest access that works.'
    source: https://www.notion.com/help/intro-to-teamspaces
  - text: 'Same window → Members tab: turn off Make default teamspace for sensitive teamspaces.'
    source: https://www.notion.com/help/intro-to-teamspaces
  - text: 'Key pages: ••• → toggle on Lock page, so they can''t be changed by accident.'
    source: https://www.notion.com/help/collaborate-within-a-workspace
  - text: Settings → Teamspaces → toggle on Limit teamspace creation to only workspace owners.
    source: https://www.notion.com/help/manage-teamspaces
    verify: 'plan: the help center doesn''t name one'
  plan_notes:
  - text: 'Business and Enterprise: Private teamspaces (hidden from people not added), advanced teamspace permissions and granular database permissions. Free and Plus alternative: Closed teamspaces plus page-level sharing.'
    source: https://www.notion.com/pricing
    plans:
    - business
    - enterprise
    - not_sure
  - text: 'Enterprise only: per-teamspace Disable guests and Disable export.'
    source: https://www.notion.com/help/intro-to-teamspaces
    plans:
    - all
  domain: governance
- id: q11
  number: 11
  title: Recovery Readiness
  control: recovery readiness and single points of failure
  question: If a key page were deleted tomorrow, or the person who runs it left, how ready are you to get it back?
  answers:
    A:
      text: Ready. We know how long Trash and version history keep things on our plan, at least 2 people can restore our key pages, and none of them sit in one person's private pages.
      points: 10
    B:
      text: We know Trash and version history exist, but not how long they keep things or who can restore.
      points: 6
    C:
      text: We'd have to rebuild from memory or ask Notion support.
      points: 2
    D:
      text: I don't know.
      points: 0
  risk: recovery in Notion has time limits and depends on who has access. Miss the window, or lose the only person with edit rights, and the page is gone. Pages in a removed member's private section are hidden from everyone.
  fixes:
  - text: 'Know your windows: Trash keeps deleted pages 30 days by default. After they''re deleted from Trash, they''re kept another 30 days, then become inaccessible to everyone, even workspace owners.'
    source: https://www.notion.com/help/duplicate-delete-and-restore-content
  - text: 'Know your plan''s version history: Free 7 days, Plus 30 days, Business 90 days, Enterprise unlimited.'
    source: https://www.notion.com/help/duplicate-delete-and-restore-content
  - text: 'Know who can restore: viewing and restoring version history needs at least Can edit access. Give at least 2 people Full access on every key page or teamspace.'
    source: https://www.notion.com/help/duplicate-delete-and-restore-content
  - text: 'Remove single points of failure: move key pages out of anyone''s Private section into a teamspace. A removed member''s private pages are hidden.'
    source: https://www.notion.com/help/whos-who-in-a-workspace
  - text: 'Last resort: Notion support can restore a snapshot of content from the past 30 days. Contact them through ? in the sidebar or team@makenotion.com.'
    source: https://www.notion.com/help/duplicate-delete-and-restore-content
  plan_notes:
  - text: 'Version history: Free 7 days, Plus 30 days, Business 90 days, Enterprise unlimited.'
    source: https://www.notion.com/pricing
    plans:
    - all
  - text: 'Enterprise only: custom Trash and retention settings. Free, Plus and Business alternative: act within the default 30-day Trash window, and name a recovery owner.'
    source: https://www.notion.com/help/workspace-settings
    plans:
    - all
  domain: resilience
- id: q12
  number: 12
  title: Recovery and Traceability
  control: recovery testing and change history
  question: If an important page were deleted or overwritten today, could you get it back and see who did it?
  answers:
    A:
      text: Yes. We know how far back our plan goes and we've tested a restore.
      points: 10
    B:
      text: Probably, through Trash or version history, but we've never tried.
      points: 6
    C:
      text: I wouldn't know where to start.
      points: 2
    D:
      text: I don't know.
      points: 0
  risk: a backup or history you've never tested is a hope, not a control. Most teams find their plan's limits on the day they need them.
  fixes:
  - text: 'Deleted pages: Trash at the bottom of the sidebar keeps them 30 days by default.'
    source: https://www.notion.com/help/duplicate-delete-and-restore-content
  - text: 'Overwritten pages: ••• → Version history → pick a version → Restore. It shows who made each change.'
    source: https://www.notion.com/help/duplicate-delete-and-restore-content
  - text: Run a 10-minute restore drill once a quarter on a test page.
  plan_notes:
  - text: 'Version history: Free 7 days, Plus 30 days, Business 90 days, Enterprise unlimited.'
    source: https://www.notion.com/pricing
    plans:
    - all
  - text: 'Enterprise only: audit log (up to 365 days of events, exportable to CSV). Free, Plus and Business alternative: version history and Trash (see Q11).'
    source: https://www.notion.com/help/audit-log
    plans:
    - all
  domain: resilience

risk_impacts:
  q1:
    B: Your own account is protected, but one teammate's stolen password still opens every page they can see.
    C: One phished password is enough to open everything that person can see in Notion.
    D: You can't tell if one stolen password opens your workspace, and Notion can't require members to use 2-step verification.
  q2:
    B: Freelancers or clients added as full members can open every open teamspace, not only their own pages.
    C: With a shared login nobody is accountable, and removing one person locks out everyone who uses it.
    D: Without knowing who uses which account, you can't remove one person cleanly or tell who did what.
  q3:
    B: Pages you meant to publish stay open with every subpage added since, and nobody has checked lately.
    C: Old public pages, their subpages and contributors' names and emails can be read by anyone with the link.
    D: Not knowing what is public means client pages could be readable by anyone with the link today.
  q4:
    B: These details stay safe only while sharing stays tight; one wrong share or connection exposes them.
    C: Everyone on the team, every guest and every connected tool can read these passwords and details.
    D: Secrets may sit in pages nobody has checked, and old versions stay in history even after deletion.
  q5:
    B: Connections nobody has reviewed keep their access to your pages until someone removes them.
    C: Each forgotten connection still holds a key to its pages, even after the person who added it leaves.
    D: Without a list of connected apps, you can't tell which outside tools can read your pages.
  q6:
    B: The AI tool can read most of your workspace, including client and finance pages.
    C: Untracked AI tools may read client and finance pages, and text in a page can try to steer them.
    D: An AI tool you don't know about reads everything it can reach, including sensitive pages.
  q7:
    B: Between someone leaving and their removal, they can still open, copy or delete company pages.
    C: People who left can likely still open, copy or delete your pages, and their connected tools keep running.
    D: If you can't confirm leavers were removed, assume some still have access to your pages.
  q8:
    B: A yearly review leaves months where past freelancers and old clients keep access.
    C: Access has only grown since day one, so old clients and past freelancers likely still have it.
    D: Not knowing when access was last reviewed means people you've forgotten may still have it.
  q9:
    B: If your only owner account is lost or locked, nobody can manage the workspace's security.
    C: 'Every extra owner is a master key: each can change security settings, export everything or delete the workspace.'
    D: Not knowing who holds owner rights means you can't tell who could export or delete everything.
  q10:
    B: New people can still see finance, HR and client pages, even if they can't change them.
    C: Every new hire or compromised account can read, edit and reshare finance, HR and client pages on day one.
    D: You can't be sure a new hire won't open finance, HR or client pages on day one.
  q11:
    B: Recovery has time limits; without knowing yours or who can restore, a deleted page can be lost.
    C: A deleted key page could be gone for good, leaving you to rebuild it from memory.
    D: If nobody knows how recovery works on your plan, a deleted page may be gone once the window closes.
  q12:
    B: A restore you've never tried is a hope; you may find your plan's limits on the day you need them.
    C: If a key page is deleted or overwritten, you'd lose time working out how to get it back.
    D: Not knowing whether you can restore a page, or see who changed it, is the gap itself.

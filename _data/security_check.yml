  disclaimer: Self-check based on your answers. General guidance, not a formal audit.
  consent: Email me my result and up to 3 follow-ups. Unsubscribe any time.
  gate_title: Your Result Is Ready
  gate_sub: Tell us where to send it. Your score shows on the next screen and lands in your inbox.
  result_note: Your full result is on its way to your inbox.

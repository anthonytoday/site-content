# Catalog for /flashcards/
#
# Anki decks. Same field shape as _data/templates.yml, so the shared includes
# (shop-grid, pd-buybox, shop-gallery, last-updated) drive both shops.
#
# status: live     -> card is clickable, price and buy button shown
# status: pending  -> card renders the hatched placeholder, not clickable
#
# stripe is present and empty on every entry. Paste a payment link into it and
# the buy button switches from Etsy to native checkout with no page edit.
#
# etsy, etsy_slug and etsy_listing_id are the real listing, transcribed from the
# Etsy extraction captured 12 Aug 2026. etsy_slug is also the folder name the
# image import Action writes to under assets/etsy/.
#
# English only. No French twin page, no second-language block, no marketplace fields.


name: One-off referral link sweep

# Single-use workflow. It applies .github/maint/2026-09-18/referral-link.json,
# which swaps the retired Notion referral code rw7o47pwsh6j for 0x8u16p4sff1
# across the 8 pages that carry it, then deletes itself in the same commit.
#
# It exists because two of those files (pages/guide.html and fr/pages/guide.html)
# are ~100 KB each, too large to rewrite through the API from a chat session.
# The spec stays in the repo as the record of what was changed.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/oneoff-referral.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: oneoff-referral
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Apply the spec
        run: python3 .github/scripts/apply_spec.py . .github/maint/2026-09-18/referral-link.json

      - name: Verify the retired code is gone
        run: |
          if grep -rn "rw7o47pwsh6j" --include="*.html" --include="*.txt" --include="*.yml" . | grep -v "^./.github/"; then
            echo "retired referral code still present"; exit 1
          fi
          echo "clean"

      - name: Remove this workflow
        run: git rm -q .github/workflows/oneoff-referral.yml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Referral link: rw7o47pwsh6j to 0x8u16p4sff1 across 8 pages

Applied .github/maint/2026-09-18/referral-link.json, 22 occurrences.
This one-off workflow removed itself in the same commit."
          git push

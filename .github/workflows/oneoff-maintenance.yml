name: One-off maintenance

# Self-deleting maintenance job. Applies the change specs under .github/maint/<date>/
# with .github/scripts/apply_spec.py on a clean checkout, commits, removes itself and
# pushes. Specs and the apply script stay in the repo as the record of what changed.
# The Build gate runs afterwards via workflow_run.

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/oneoff-maintenance.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: oneoff-maintenance
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Apply the 9 Sept 2026 accessibility specs (152 ops)
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 .github/scripts/apply_spec.py . \
            .github/maint/2026-09-09/A-contrast.json \
            .github/maint/2026-09-09/B-semantic.json \
            .github/maint/2026-09-09/C-source.json \
            .github/maint/2026-09-09/D-dark-components.json \
            .github/maint/2026-09-09/E-mobile-h2.json
          test -z "$(grep -rl '#6B7280' _includes assets/css || true)"

      - name: Remove this workflow and commit
        run: |
          set -e
          git rm -q .github/workflows/oneoff-maintenance.yml
          git add -A
          git commit -m "Accessibility pass 2026-09-09: WCAG AA contrast, heading order, table captions, link underlines, labels" \
            -m "Symptom: Lighthouse accessibility 89 to 96 on every page; #6B7280 gray on #F5F5F5 measured 4.43:1 (needs 4.5) on footer and guide TOC across all 76 content pages, #A8B4C2 on white 2.1:1 on service pages, heading levels skipped on 6 pages, fake table captions on 2, guide links distinguishable by color only, unlabeled honeypot on /start/. Fix: gray token #6B7280 to #5B6672 (5.37:1 on #F5F5F5), light gray to #5F6F82 (4.83:1 on white) except on navy components where #A8B4C2 and #7FA6FF stay (8.3:1 and 7.3:1), 22 CSS bundles re-hashed with every reference rewritten, h4 to h3 and h3 to h2 with page-scoped rules preserving the exact computed style, real captions, underlined guide links, aria-label on the honeypot. Evidence: accessibility 100 on the 3 pricing pages and at least 95 on all 15 measured pages, 0 color-contrast items, 0 heading-order failures, performance unchanged, gate green, 152 ops reproduce the reviewed tree byte for byte. Rollback: revert this commit."
          git push

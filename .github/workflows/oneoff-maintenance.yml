name: One-off maintenance

# Self-deleting maintenance job for changes too large for the API path
# (mass deletes, renames, edits to big files). Runs once on the push that
# adds it, applies the listed changes, removes itself and its edits file,
# and pushes. The Build gate runs afterwards via workflow_run.
# Attempt 2: the first run failed on its own self-referential grep in the
# image-rename step; that step is dropped because the three guide images
# are listed in the bot-owned template-images-manifest.json and a rename
# there needs a manifest edit first.

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/oneoff-maintenance.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: oneoff-maintenance
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Untrack the Jekyll build output
        run: |
          set -e
          if git ls-files --error-unmatch _site >/dev/null 2>&1; then
            git rm -r -q --cached _site
          fi

      - name: Apply the 10 line edits from the 9 Sept 2026 maintenance pass
        run: |
          python3 - <<'PY'
          import json, sys
          pairs = json.loads(open('.github/oneoff-edits.json', encoding='utf-8').read())
          for path, old, new in pairs:
              s = open(path, encoding='utf-8').read()
              if s.count(old) != 1:
                  sys.exit(f"{path}: expected exactly one match, found {s.count(old)}")
              open(path, 'w', encoding='utf-8').write(s.replace(old, new))
          print(f"applied {len(pairs)} edits")
          PY
          git rm -q .github/oneoff-edits.json

      - name: Remove this workflow and commit
        run: |
          set -e
          git rm -q .github/workflows/oneoff-maintenance.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Maintenance 2026-09-09: untrack _site, 10 copy, SEO and gate fixes, remove one-off workflow" \
            -m "Symptom: _site/ (2,664 files, 127 MB) was tracked although Pages builds from source; two stray self-closing slashes on the fr/notion badge images; three meta descriptions over 165 characters; French hero and stat-card wording; a missing accent in the contact title; the Certified Admin badge described as a Consulting Partner badge. Fix: git rm --cached _site and apply the ten exact line edits. The fallback branch fallback/pre-offer-ladder-2026-09-09 still holds the previous state."
          git push

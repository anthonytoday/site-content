name: Build architecture CSS bundle

# One-off. Creates assets/css/b-d8d221ab68.css from the existing bundle plus the
# rules the rebuilt architecture pages need, then deletes itself.

on:
  push:
    paths:
      - '.github/workflows/build-arch-css.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy the current bundle and append the new rules
        run: |
          cp assets/css/b-fd589967b8.css assets/css/b-d8d221ab68.css
          cat >> assets/css/b-d8d221ab68.css <<'CSSEOF'
          .uc-hero p{font-size:17px;line-height:1.65;color:var(--text-gray)}
          .hero-actions{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:26px}
          .uc-ghost-button{display:inline-block;background:var(--white);color:var(--navy);border:1px solid var(--border);padding:13px 26px;border-radius:6px;font-weight:500;font-size:15px}
          .uc-ghost-button:hover{border-color:var(--navy)}
          .glance{display:flex;flex-wrap:wrap;justify-content:center;max-width:900px;margin:38px auto 0;padding:0 20px}
          .glance-item{padding:4px 24px;text-align:center;border-left:1px solid var(--border)}
          .glance-item:first-child{border-left:0}
          .glance-k{display:block;font-size:15px;font-weight:700;color:var(--navy)}
          .glance-v{display:block;font-size:12.5px;color:var(--text-gray);margin-top:3px}
          .ps-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;max-width:960px;margin:44px auto 0;padding:0 20px}
          .ps-card{border:1px solid var(--border);border-radius:12px;padding:24px 26px;background:var(--white)}
          .ps-card.problem{border-left:3px solid var(--red)}
          .ps-card.solution{border-left:3px solid var(--blue)}
          .ps-label{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-gray);margin-bottom:10px}
          .ps-card.problem .ps-label{color:var(--red)}
          .ps-card.solution .ps-label{color:var(--blue)}
          .ps-card h3{font-size:18px;font-weight:600;color:var(--navy);line-height:1.4;margin-bottom:10px}
          .ps-card p{font-size:14.5px;line-height:1.7;color:var(--text-gray);margin:0}
          .section-lead{max-width:720px;margin:52px auto 0;padding:0 20px;text-align:center}
          .section-lead h2{font-size:26px;font-weight:600;color:var(--navy);margin-bottom:8px}
          .section-lead p{font-size:15px;color:var(--text-gray);margin:0}
          @media(max-width:720px){.ps-grid{grid-template-columns:1fr}.glance-item{border-left:0;padding:8px 14px}}
          CSSEOF
          sed -i 's/^          //' assets/css/b-d8d221ab68.css
          echo "bundle bytes: $(wc -c < assets/css/b-d8d221ab68.css)"

      - name: Remove this one-off workflow
        run: git rm -q .github/workflows/build-arch-css.yml

      - name: Commit the bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "Add the CSS bundle the rebuilt architecture pages reference"
            git pull --rebase --autostash
            git push
          fi

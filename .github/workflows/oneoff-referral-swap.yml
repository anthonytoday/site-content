name: One-off referral link swap
on:
  push:
    branches: [main]
    paths: ['.github/workflows/oneoff-referral-swap.yml']
permissions:
  contents: write
jobs:
  swap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Swap links, delete this workflow, verify, push
        run: |
          set -euo pipefail
          git rm -q .github/workflows/oneoff-referral-swap.yml
          OLD='affiliate\.notion\.so/(anthonytoday|rw7o47pwsh6j|0x8u16p4sff1|6tl0gkz5eqr5)([^A-Za-z0-9_-]|$)'
          FILES=$(grep -rlE "$OLD" --exclude-dir=.git . || true)
          echo "Files: $FILES"
          if [ -n "$FILES" ]; then
            echo "$FILES" | xargs sed -i -E "s#${OLD}#affiliate.notion.so/anthony-today\2#g"
          fi
          if grep -rnE "$OLD" --exclude-dir=.git .; then echo "Old links remain"; exit 1; fi
          echo "New link count: $(grep -roE 'affiliate\.notion\.so/anthony-today' --exclude-dir=.git . | wc -l)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Notion referral link: affiliate.notion.so/anthony-today everywhere (EN and FR); remove one-off workflow"
          git push

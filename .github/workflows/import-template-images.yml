name: Import template images
on:
  push:
    paths:
      - 'assets/template-images-manifest.json'
  workflow_dispatch:
  # Anything still missing is retried automatically, so a run that fails or
  # never fires heals itself within six hours instead of waiting to be noticed.
  schedule:
    - cron: '0 */6 * * *'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download images
        run: python3 .github/scripts/import_images.py
      - name: Commit whatever arrived
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Stage all of assets, not just assets/templates. The original workflow
          # staged only the templates folder, so guide images downloaded into
          # assets/guides were silently discarded and the job reported success.
          git add assets .github/import-result.txt
          if git diff --cached --quiet; then
            echo "nothing new to commit"
          else
            git commit -m "Import images listed in the manifest"
            git pull --rebase --autostash
            git push
          fi
      - name: Fail if anything is still missing
        run: |
          grep -q 'failed=0' .github/import-result.txt || {
            echo "::error::Some images could not be downloaded. See .github/import-result.txt"
            cat .github/import-result.txt
            exit 1
          }

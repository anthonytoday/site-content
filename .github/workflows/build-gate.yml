name: Build gate

# Mirrors the local pre-push gate in CI, so breakage from web edits or the
# image bots (which push straight to main) fails loudly here instead of
# publishing to the live site. Read-only: this workflow never pushes.

on:
  push:
    branches: [main]
  # Also gate pull requests into main, so a stale CSP hash (or any other gate
  # failure) shows on the PR before the merge publishes it.
  pull_request:
    branches: [main]
  # Bot commits are made with GITHUB_TOKEN, which never fires push-triggered
  # workflows, so the gate also runs after each bot workflow completes. On a
  # workflow_run event the checkout below resolves to the head of main.
  workflow_run:
    workflows:
      - Extract Etsy listing images
      - Import template images
      - Sync Notion Marketplace gallery
      - Site optimise
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One group per PR, one for main, so a PR run never cancels a main run.
  group: build-gate-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"

      # No Gemfile in this repo: the site is vanilla Jekyll (data files,
      # includes, layouts, no plugins), so a plain install is enough and
      # matches how GitHub Pages builds it.
      - name: Install Jekyll
        run: gem install jekyll --no-document

      - name: Build the site
        run: jekyll build --trace

      # A single-quoted apostrophe in an inline script is valid HTML and a
      # valid Jekyll build, then a SyntaxError in the browser. Parse every
      # inline script from the built HTML so that fails here instead.
      - name: Syntax-check inline scripts
        run: python3 .github/scripts/check-inline-js.py _site

      # Pages with a meta Content-Security-Policy (/r/, /f/, /unsubscribe/)
      # pin their inline <script> and <style> by sha256. Any edit without a
      # recomputed pin would block the script on the live page, so a missing
      # or stale pin fails here (Security Q10). The checker ships with the
      # result pages (0033, on main). A missing checker fails the step, so a PR
      # cannot pass by deleting or renaming it (Security BR-09).
      - name: Check CSP hash pins
        run: |
          if [ ! -f .github/scripts/check-csp-hash.py ]; then
            echo "::error::.github/scripts/check-csp-hash.py is missing"
            exit 1
          fi
          python3 .github/scripts/check-csp-hash.py _site

      # Cloudflare Web Analytics beacon only on the explicit include list in
      # _data/cf_analytics.yml; never on /r/, /f/, /unsubscribe/ or other pages.
      - name: Check the analytics beacon include list
        run: |
          python3 .github/scripts/check-cf-analytics.py _site .
          python3 .github/scripts/test_check_cf_analytics.py _site .

      # PRIVATE_NAME is an optional repository secret. When set, the gate
      # asserts the private name appears nowhere outside the agreed
      # carve-outs (the LinkedIn URL and the noindex /go/ redirect stubs).
      # The name itself is never written into the repo.
      - name: Run the gate
        env:
          PRIVATE_NAME: ${{ secrets.PRIVATE_NAME }}
        run: python3 .github/scripts/gate.py _site .

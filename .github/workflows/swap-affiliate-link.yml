name: Swap affiliate link

# One-off. Replaces the retired Notion referral link with the current one
# across every file that carries it, then deletes itself in the same commit.

on:
  push:
    paths:
      - '.github/workflows/swap-affiliate-link.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  swap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Replace the retired referral link
        run: |
          grep -rl 'affiliate\.notion\.so/0x8u16p4sff1' --exclude-dir=.git . \
            | xargs -r sed -i 's#affiliate\.notion\.so/0x8u16p4sff1#affiliate.notion.so/rw7o47pwsh6j#g'
          echo "remaining old links: $(grep -rl 'affiliate\.notion\.so/0x8u16p4sff1' --exclude-dir=.git . | wc -l)"
          echo "new links now present in: $(grep -rl 'affiliate\.notion\.so/rw7o47pwsh6j' --exclude-dir=.git . | wc -l) files"

      - name: Remove this one-off workflow
        run: git rm -q .github/workflows/swap-affiliate-link.yml

      - name: Commit the swap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "Point every Notion referral link at the current affiliate URL"
            git pull --rebase --autostash
            git push
          fi

# Cloudflare Web Analytics beacon token. Empty means the site emits no beacon at
# all and nothing is measurable, the shops included.
#
# www.anthonytoday.com is already proxied through Cloudflare, so the simpler route
# is Cloudflare dashboard, Analytics and Logs, Web Analytics, add the site with
# automatic setup. Cloudflare injects the beacon itself and this stays empty.
# Only fill this in for manual setup: paste the token out of the snippet Cloudflare
# shows. The layout emits nothing while it is "".
cf_analytics_token: ""

# Reveals the Shop menu in the header: Notion Templates, Anki Flashcards, Help.
# false keeps the navigation exactly as it is today. Flip to true to launch.
shop_nav: false

# Lead capture popup. Flip to true once the email-ops Worker is deployed.
offer_popup_enabled: true

# Lead capture popup endpoint (Cloudflare Worker, email-ops)
offer_api: "https://offer-capture.learningamazonfba.workers.dev/api/claim-offer"

# Notion Workspace Security Check API (Cloudflare Worker security-check-api, workers.dev).
# DRY_RUN is set on the Worker itself; this URL does not change when it goes live.
security_check_api: "https://security-check-api.learningamazonfba.workers.dev"
# Supabase second store for the www /r/ and /f/ result pages (0038): origin only; the page calls <origin>/functions/v1/sc-view.
security_check_sb_origin: "https://jzmglkzmqgojjnqxoytf.supabase.co"

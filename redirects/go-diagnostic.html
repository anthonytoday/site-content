<title>Redirecting to Notion Jumpstart</title>

<script>location.replace({{ site.data.checkout.jumpstart | jsonify }});</script>
</head>
<body>
<p>Taking you to Notion Jumpstart. <a href="{{ site.data.checkout.jumpstart }}" rel="nofollow noopener">Continue</a>.</p>
</body>

name = "gumroad-mcp"
main = "src/index.js"
compatibility_date = "2026-08-08"

# Declared rather than left to Cloudflare to guess, which is what the build log
# warned about. workers.dev is how Claude and Notion reach the MCP endpoint.
workers_dev = true
preview_urls = false

[observability]
enabled = true

# Two secrets, both set with `wrangler secret put`. Neither belongs in this file.
#   GUMROAD_ACCESS_TOKEN  the account-wide Gumroad token
#   MCP_AUTH_TOKEN        the bearer Claude presents to reach /mcp
